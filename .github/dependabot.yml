  - package-ecosystem: "github-actions"
    directory: "/actions/terraform-fmt-check-recursive"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/actions/terraform-init"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
