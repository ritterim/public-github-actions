  - package-ecosystem: "github-actions"
    directory: "/actions/path-name-validator"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/actions/regex-validator"
    schedule:
