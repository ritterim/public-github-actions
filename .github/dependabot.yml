  - package-ecosystem: "github-actions"
    directory: "/actions/terraform-show-plan-file"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/actions/terraform-validate"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/actions/version-number-major-minor-validator"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/actions/version-number-validator"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm lockfiles. `directories` supports an explicit list plus cross-directory
  # grouping, so these five collapse into one PR per shared dependency bump
  # instead of five.
  - package-ecosystem: "npm"
    directories:
      - "/actions/azure-web-app-swap-when-healthy"
      - "/actions/health-and-version-check"
      - "/actions/regex-validator"
      - "/actions/setup-git-credentials"
      - "/forks/github-app-token"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        group-by: "dependency-name"
